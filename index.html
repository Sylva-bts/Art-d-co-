<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paiement OxaPay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="box">
      <h1>Paiement OxaPay</h1>

      <form id="payment-form">
        <label for="amount">Montant (USD)</label>
        <input id="amount" type="number" min="1" step="0.01" value="25" required />
        <button id="pay-btn" type="submit">Payer maintenant</button>
      </form>

      <p id="message" aria-live="polite"></p>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
